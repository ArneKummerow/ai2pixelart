<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai2pixelart — workspace</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #0f1115; color: #d7dae0; font: 13px/1.5 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  select, input[type=number], input[type=text] { background: #171a21; color: #d7dae0; border: 1px solid #333a4a; border-radius: 6px; padding: 3px 6px; font: inherit; }
  input[type=range] { accent-color: #3b82f6; }
  button { background: #232837; color: #d7dae0; border: 1px solid #333a4a; border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: #4a5468; }
  button.on { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }

  #topbar { display: flex; gap: 10px; align-items: center; padding: 7px 12px; border-bottom: 1px solid #232837; }
  #status { flex: 1; color: #9fb0cc; font-size: 12px; white-space: nowrap; overflow-x: hidden; text-overflow: ellipsis; }
  #status.err { color: #ff7a7a; font-weight: 600; }

  #row { flex: 1; display: flex; min-height: 0; }
  .side { display: flex; flex-direction: column; min-height: 0; background: #12151b; flex: 0 0 auto; }
  #left { width: 280px; border-right: 1px solid #232837; }
  #right { width: 330px; border-left: 1px solid #232837; }
  .sizer { flex: 0 0 6px; cursor: col-resize; position: relative; touch-action: none; }
  .sizer:hover::after, .sizer.active::after { content: ""; position: absolute; inset: 0 2px; background: #3b82f6; border-radius: 2px; }
  .side.collapsed { width: 26px !important; }
  .side.collapsed > *:not(.shead) { display: none; }
  .shead { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid #232837; color: #8a90a0; font-size: 12px; }
  .side.collapsed .shead { border-bottom: none; padding: 5px 3px; justify-content: center; }
  .side.collapsed .shead .stitle { display: none; }
  .shead .stitle { flex: 1; }
  .shead .fold { background: none; border: none; color: #8a90a0; padding: 0 4px; font-size: 13px; }
  .shead .fold:hover { color: #d7dae0; }

  #center { flex: 1; position: relative; display: flex; gap: 4px; min-width: 0; background: #0a0c10; }
  .runbar { position: absolute; top: 0; left: 0; right: 0; height: 3px; overflow: hidden; visibility: hidden; z-index: 6; }
  #center.pending .runbar { visibility: visible; }
  .runbar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%;
                   background: #3b82f6; border-radius: 2px; animation: runslide 1.1s linear infinite; }
  @keyframes runslide { from { left: -35%; } to { left: 100%; } }
  #center.pending img.out { opacity: .55; transition: opacity .2s; }

  #viewctl { position: absolute; top: 8px; right: 8px; z-index: 5; display: flex; gap: 6px; align-items: center;
             background: rgba(18,21,27,.9); border: 1px solid #2a3040; border-radius: 8px; padding: 4px 6px; }
  #viewctl .zl { min-width: 44px; text-align: center; color: #8a90a0; font-size: 12px; }
  #srcbadge { position: absolute; top: 8px; left: 8px; z-index: 5; background: rgba(18,21,27,.9);
              border: 1px solid #2a3040; border-radius: 8px; padding: 3px 10px; color: #8a90a0; font-size: 12px; }
  body.swap #srcbadge { color: #ffd479; }

  .imgwrap { flex: 1; overflow: auto; display: grid; place-items: center; cursor: grab; touch-action: none; min-width: 0; }
  .imgwrap.panning { cursor: grabbing; }
  .pximg { image-rendering: pixelated; display: none; }
  .imgwrap .cap { display: none; }
  #center.sbs .imgwrap { border: 1px solid #1c2130; position: relative; }
  #center.sbs .imgwrap .cap { display: block; position: absolute; top: 6px; left: 8px; color: #667; font-size: 11px; z-index: 2; }
  .imgwrap.loaded img.out { display: block; }
  .imgwrap.loaded .note { display: none; }
  .note { padding: 20px; color: #667; text-align: center; }
  /* swap mode: one wrap holding both imgs */
  #center.single .imgwrap img.orig { display: none; }
  body.swap #center.single .imgwrap.loaded img.out { display: none; }
  body.swap #center.single .imgwrap.loaded img.orig { display: block; }

  .form { padding: 8px 10px 8px 8px; display: grid; grid-template-columns: minmax(78px, auto) minmax(0, 1fr); gap: 5px 8px; align-items: center; }
  .form label { color: #8a90a0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .form > select, .form > input[type=text] { min-width: 0; width: 100%; }
  .form .pair { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .form .pair input[type=range] { flex: 1 1 40px; min-width: 30px; }
  .form .pair input[type=number] { flex: 0 0 56px; width: 56px; }
  .form .pair input[type=text] { flex: 1 1 auto; min-width: 0; }
  .form .pair button { flex: 0 0 auto; padding: 3px 8px; }
  .form .pair .granv { flex: 0 0 56px; text-align: center; color: #9fb0cc; }
  .form input:disabled { opacity: .35; }
  #paramsbox { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  #statsbox { flex: 0 0 auto; max-height: 45%; overflow: auto; border-top: 1px solid #232837; padding: 8px; }

  .gallery { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .gallery.drop { outline: 2px dashed #3b82f6; outline-offset: -4px; }
  .gtools { display: flex; gap: 8px; align-items: center; padding: 8px; border-bottom: 1px solid #232837; }
  .gtools .hint { color: #667; font-size: 11px; }
  .thumbs { flex: 1; overflow: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; align-content: start; }
  .thumb { cursor: pointer; border: 2px solid transparent; border-radius: 8px; padding: 3px; background: #0a0c10; }
  .thumb:hover { border-color: #3a4256; }
  .thumb.sel { border-color: #3b82f6; }
  .thumb img { width: 100%; display: block; border-radius: 5px; }
  .thumb .tname { font-size: 11px; color: #8a90a0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 2px; }
  .thumb .tname span { color: #566; }

  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 2px 8px; text-align: right; border-bottom: 1px solid #232837; font-size: 12px; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; color: #8a90a0; font-weight: 500; }
  th { color: #8a90a0; font-weight: 500; }

  .colorpop { position: absolute; inset: 0; z-index: 8; background: rgba(10,12,16,.97); overflow: auto; padding: 12px; }
  .colorpop .cphead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: #9fb0cc; }
  .colorpop .cphead select { font-size: 11px; padding: 2px 4px; }
  .colorpop .cphead .x { margin-left: auto; background: none; border: none; color: #8a90a0; font-size: 15px; cursor: pointer; }
  .colorpop .cphead .x:hover { color: #f66; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
  .sw { border: 1px solid #2a3040; border-radius: 6px; overflow: hidden; cursor: copy; background: #14171e; }
  .sw .c { height: 32px; }
  .sw .t { font-size: 10px; color: #8a90a0; padding: 2px 4px; white-space: nowrap; }

  .batchpop .bprog { height: 6px; background: #1c2130; border-radius: 3px; overflow: hidden; margin: 4px 0 8px; }
  .batchpop .bfill { height: 100%; background: #3b82f6; width: 0; transition: width .2s; }
  .batchpop .bstat { color: #9fb0cc; font-size: 12px; margin-bottom: 10px; }
  .batchpop .bstat button { margin-left: 8px; }
  .batchpop .bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .batchpop .bcell { background: #14171e; border: 1px solid #2a3040; border-radius: 6px; padding: 4px; }
  .batchpop .bcell img { width: 100%; image-rendering: pixelated; border-radius: 4px; display: block; }
  .batchpop .bcell .bname { font-size: 10px; color: #8a90a0; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .batchpop .bcell.err { padding: 12px; }

  .form label[title] { cursor: help; text-decoration: underline dotted #4a5468; text-underline-offset: 2px; }
  .helpbody { max-width: 700px; margin: 0 auto; color: #b6bdc9; font-size: 12.5px; padding-bottom: 24px; }
  .helpbody h3 { color: #d7dae0; font-size: 13px; margin: 16px 0 6px; border-bottom: 1px solid #232837; padding-bottom: 3px; }
  .helpbody p { margin: 6px 0; }
  .helpbody dt { color: #d7dae0; font-weight: 600; margin-top: 9px; }
  .helpbody dt span { color: #667; font-weight: 400; }
  .helpbody dd { margin: 1px 0 0 0; }
  .helpbody code { background: #171a21; border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<div id="topbar">
  <button class="dl" title="download output" onclick="downloadResult()" disabled>⬇ download</button>
  <button class="cc" title="count distinct colors of the output" onclick="toggleColors()" disabled>🎨 palette</button>
  <button class="hp" title="explain the approaches and parameters" onclick="toggleHelp()">? help</button>
  <button class="bt" title="clean every workspace image with the current parameters" onclick="toggleBatch()">▦ batch</button>
  <span id="status">—</span>
</div>
<div id="row">
  <div class="side" id="left">
    <div class="shead"><button class="fold" onclick="toggleSide('left')">⟨⟨</button><span class="stitle">workspace</span></div>
  </div>
  <div class="sizer" data-side="left"></div>
  <div id="center" class="single">
    <div class="runbar"></div>
    <div id="srcbadge">output</div>
    <div id="viewctl">
      <button id="modebtn" onclick="toggleView()" title="switch between side-by-side and swap view">side-by-side</button>
      <button onclick="setFit()" title="fit to window (0)">fit</button>
      <button onclick="setZoomF(1)" title="pixel-perfect: 1 image pixel = 1 screen pixel">100%</button>
      <span class="zl" id="zoomlabel">fit</span>
    </div>
  </div>
  <div class="sizer" data-side="right"></div>
  <div class="side" id="right">
    <div class="shead"><span class="stitle">parameters</span><button class="fold" onclick="toggleSide('right')">⟩⟩</button></div>
    <div id="paramsbox"></div>
    <div id="statsbox"></div>
  </div>
</div>

<script>
"use strict";
const DEFAULTS = { granularity: 1, merge_de: 3.0, keep_frac: 0.34, absorb_de: "", absorb_frac: 0.05, pitch: "", max_colors: "", palette: "", leash: "", denoise: true, smooth: true, consensus: false };
const GRAN = [1 / 3, 1 / 2, 1, 2, 3, 4];
const SLIDERS = [
  ["merge_de", "color merging", 0.5, 20, 0.5,
   "(merge ΔE) shades closer than this color distance become one palette color — higher gives fewer, cleaner colors; lower keeps subtle shades apart"],
  ["keep_frac", "cell sampling", 0.1, 1, 0.02,
   "(cell window) how much of each cell's interior is read for its color — smaller ignores bleed from neighboring cells, larger is steadier on noise"],
  ["absorb_frac", "absorb amount", 0, 0.3, 0.01,
   "(absorb frac) shades covering less than this share of the image may be swallowed by a similar stronger color — raise to clean up noise shades, lower to protect rare details"],
];
const OPTIONAL = [
  ["pitch", "pixel size", 1.6, 16, 0.05, 5,
   "(pitch) size of one art pixel in image pixels — set manually when detection fails, e.g. on very fine grids under ~2 px"],
  ["max_colors", "colors", 2, 128, 1, 16,
   "(max colors) target and cap for the palette size — auto uses the image's natural palette; more splits shades apart, fewer merges them"],
  ["absorb_de", "absorb range", 0, 40, 1, 15,
   "(absorb ΔE) how similar a rare shade must be to a stronger color to be swallowed by it — auto adapts to the detected pixel size"],
];

let IMAGES = [], PRESETS = [], NN_MODELS = [];
let state = { image: null, preset: "classical", params: { ...DEFAULTS }, view: "single", left: true, right: true, leftW: 280, rightW: 330, zoomF: null, palfmt: "png1" };
let swap = false;
let result = null;   // {image, info, key}
let rt = { timer: null, token: 0, pending: false, error: null };

init();
async function init() {
  await refreshImages();
  loadState();
  if (!state.image || !IMAGES.some(i => i.name === state.image)) state.image = IMAGES.length ? IMAGES[0].name : null;
  render();
}

async function refreshImages() {
  const d = await fetch("/api/images").then(r => r.json());
  IMAGES = d.images; PRESETS = d.presets; NN_MODELS = d.nn_models || [];
}

function saveState() { localStorage.setItem("a2p-workspace-v4", JSON.stringify(state)); }
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem("a2p-workspace-v4"));
    if (!s || typeof s.params !== "object") return;
    state = { ...state, ...s, params: { ...DEFAULTS, ...s.params } };
    if (state.preset !== "custom" && !PRESETS.some(pr => pr.key === state.preset)) state.preset = "classical";
    if (!(typeof state.zoomF === "number" && state.zoomF > 0)) state.zoomF = null;
  } catch (e) {}
}

function imgEntry() { return IMAGES.find(i => i.name === state.image); }
function imgURL(name) { return "/img/" + encodeURIComponent(name); }

// ---------- layout ----------

function render() {
  renderGallery();
  renderParams();
  renderCenter();
  renderStats();
  document.getElementById("left").classList.toggle("collapsed", !state.left);
  document.getElementById("right").classList.toggle("collapsed", !state.right);
  applySidebarWidths();
  document.getElementById("modebtn").textContent = state.view === "single" ? "side-by-side" : "swap view";
  applyZoomAll();
  updateSwapUI();
  paintResult();
  runClean();
}

function toggleSide(which) {
  state[which] = !state[which];
  saveState();
  document.getElementById(which).classList.toggle("collapsed", !state[which]);
}

function applySidebarWidths() {
  document.getElementById("left").style.width = state.leftW + "px";
  document.getElementById("right").style.width = state.rightW + "px";
}

document.querySelectorAll(".sizer").forEach(sz => {
  sz.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    sz.setPointerCapture(e.pointerId);
    sz.classList.add("active");
    const which = sz.dataset.side, key = which + "W";
    const start = e.clientX, w0 = state[key];
    const move = ev => {
      const d = ev.clientX - start;
      state[key] = Math.max(160, Math.min(620, which === "left" ? w0 + d : w0 - d));
      applySidebarWidths();
    };
    const stop = () => { sz.classList.remove("active"); sz.removeEventListener("pointermove", move); saveState(); };
    sz.addEventListener("pointermove", move);
    sz.addEventListener("pointerup", stop, { once: true });
    sz.addEventListener("pointercancel", stop, { once: true });
  });
});
function toggleView() {
  state.view = state.view === "single" ? "sbs" : "single";
  saveState(); render();
}
function toggleSwap() {
  swap = !swap;
  updateSwapUI();
}
function updateSwapUI() {
  document.body.classList.toggle("swap", swap);
  const badge = document.getElementById("srcbadge");
  badge.textContent = state.view === "sbs" ? "original | output" : (swap ? "original (Space)" : "output (Space)");
}

function renderCenter() {
  const c = document.getElementById("center");
  c.querySelectorAll(".imgwrap").forEach(el => el.remove());
  c.querySelector(".colorpop")?.remove();
  c.classList.toggle("single", state.view === "single");
  c.classList.toggle("sbs", state.view === "sbs");
  if (state.view === "single") {
    c.appendChild(imgWrap("both"));
  } else {
    c.appendChild(imgWrap("orig"));
    c.appendChild(imgWrap("out"));
  }
}

function imgWrap(kind) {
  const wrap = document.createElement("div");
  wrap.className = "imgwrap";
  const cap = kind === "orig" ? "original" : kind === "out" ? "output" : "";
  wrap.innerHTML = `<span class="cap">${cap}</span><div class="note">${state.image ? "running…" : "workspace is empty — add images on the left"}</div>
    <img class="pximg out"><img class="pximg orig">`;
  if (state.image) {
    if (kind !== "out") wrap.querySelector("img.orig").src = imgURL(state.image);
    if (kind === "orig") { wrap.querySelector("img.out").src = imgURL(state.image); wrap.classList.add("loaded"); }
  }
  wireImgWrap(wrap);
  return wrap;
}

// ---------- zoom + pan (shared across wraps) ----------

function baseW() { const im = imgEntry(); return im ? im.width : 100; }
function fitScale(wrap) {
  const r = wrap.getBoundingClientRect();
  const im = imgEntry();
  if (!im || !r.width) return 1;
  return Math.min(r.width / im.width, r.height / im.height);
}
function curScale(wrap) { return state.zoomF != null ? state.zoomF : fitScale(wrap); }
function setFit() { state.zoomF = null; applyZoomAll(); saveState(); }
function setZoomF(f) { state.zoomF = Math.max(0.05, Math.min(64, f)); applyZoomAll(); saveState(); }
function applyZoomAll() {
  document.querySelectorAll(".imgwrap").forEach(wrap => {
    const w = baseW() * curScale(wrap);
    wrap.querySelectorAll(".pximg").forEach(img => img.style.width = w + "px");
  });
  document.getElementById("zoomlabel").textContent =
    state.zoomF == null ? "fit" : Math.round(state.zoomF * 100) + "%";
}

let syncing = false;
function syncScroll(srcEl) {
  if (syncing) return;
  syncing = true;
  document.querySelectorAll(".imgwrap").forEach(el => {
    if (el !== srcEl) { el.scrollLeft = srcEl.scrollLeft; el.scrollTop = srcEl.scrollTop; }
  });
  syncing = false;
}

function wireImgWrap(wrap) {
  wrap.addEventListener("scroll", () => syncScroll(wrap));
  wrap.addEventListener("wheel", e => {
    e.preventDefault();
    const s0 = curScale(wrap);
    const s1 = Math.max(0.05, Math.min(64, s0 * Math.exp(-e.deltaY * 0.0015)));
    const r = wrap.getBoundingClientRect();
    const ax = e.clientX - r.left + wrap.scrollLeft, ay = e.clientY - r.top + wrap.scrollTop;
    state.zoomF = s1;
    applyZoomAll();
    const k = s1 / s0;
    const nl = ax * k - (e.clientX - r.left), nt = ay * k - (e.clientY - r.top);
    document.querySelectorAll(".imgwrap").forEach(el => { el.scrollLeft = nl; el.scrollTop = nt; });
    saveState();
  }, { passive: false });
  wrap.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    wrap.setPointerCapture(e.pointerId);
    wrap.classList.add("panning");
    const sx = wrap.scrollLeft + e.clientX, sy = wrap.scrollTop + e.clientY;
    const move = ev => { wrap.scrollLeft = sx - ev.clientX; wrap.scrollTop = sy - ev.clientY; };
    const stop = () => { wrap.removeEventListener("pointermove", move); wrap.classList.remove("panning"); };
    wrap.addEventListener("pointermove", move);
    wrap.addEventListener("pointerup", stop, { once: true });
    wrap.addEventListener("pointercancel", stop, { once: true });
  });
  wrap.addEventListener("dblclick", setFit);
}

// ---------- gallery (left sidebar) ----------

function renderGallery() {
  const side = document.getElementById("left");
  side.querySelector(".gallery")?.remove();
  const div = document.createElement("div");
  div.className = "gallery";
  div.innerHTML = `<div class="gtools">
      <button onclick="this.nextElementSibling.click()">add images…</button>
      <input type="file" accept="image/*" multiple hidden onchange="uploadFiles(this.files); this.value='';">
      <span class="hint">or drop files here</span>
    </div>
    <div class="thumbs"></div>`;
  const thumbs = div.querySelector(".thumbs");
  if (!IMAGES.length) thumbs.innerHTML = `<div class="note" style="grid-column:1/-1">workspace is empty — drop images here</div>`;
  IMAGES.forEach(im => {
    const t = document.createElement("div");
    t.className = "thumb" + (im.name === state.image ? " sel" : "");
    t.innerHTML = `<img loading="lazy" src="${imgURL(im.name)}">
      <div class="tname">${im.name} <span>${im.width}×${im.height}</span></div>`;
    t.onclick = () => setImage(im.name);
    thumbs.appendChild(t);
  });
  ["dragenter", "dragover"].forEach(ev => div.addEventListener(ev, e => { e.preventDefault(); div.classList.add("drop"); }));
  div.addEventListener("dragleave", () => div.classList.remove("drop"));
  div.addEventListener("drop", e => { e.preventDefault(); div.classList.remove("drop"); uploadFiles(e.dataTransfer.files); });
  side.appendChild(div);
}

function setImage(name) {
  if (!name) return;
  state.image = name;
  saveState(); render();
}
function stepImage(d) {
  if (!IMAGES.length) return;
  const i = Math.max(0, IMAGES.findIndex(im => im.name === state.image));
  setImage(IMAGES[(i + d + IMAGES.length) % IMAGES.length].name);
}

async function uploadFiles(files) {
  let last = null;
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    const data = await new Promise((ok, err) => {
      const rd = new FileReader();
      rd.onload = () => ok(rd.result);
      rd.onerror = () => err(new Error("could not read " + f.name));
      rd.readAsDataURL(f);
    });
    const resp = await fetch("/api/upload", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: f.name, data }),
    });
    const out = await resp.json();
    if (!resp.ok) { alert("upload failed: " + (out.error || resp.statusText)); continue; }
    last = out.name;
  }
  if (last) { await refreshImages(); setImage(last); }
}
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());

// returning to the tab re-syncs presets/models/images (a neural checkpoint
// that finished training appears without a reload)
let lastFocusSync = 0;
window.addEventListener("focus", async () => {
  if (Date.now() - lastFocusSync < 10000) return;
  lastFocusSync = Date.now();
  const before = JSON.stringify([PRESETS, NN_MODELS, IMAGES.map(i => i.name)]);
  await refreshImages();
  if (JSON.stringify([PRESETS, NN_MODELS, IMAGES.map(i => i.name)]) !== before) {
    renderGallery();
    renderParams();
  }
});

// ---------- parameters (right sidebar, top) ----------

function granLabel(g) { return g < 1 ? "1/" + Math.round(1 / g) + "×" : g + "×"; }
function granIndex(g) {
  let best = 0;
  GRAN.forEach((v, i) => { if (Math.abs(Math.log(g / v)) < Math.abs(Math.log(g / GRAN[best]))) best = i; });
  return best;
}

function renderParams() {
  const box = document.getElementById("paramsbox");
  box.innerHTML = "";
  const f = document.createElement("div");
  f.className = "form";
  f.insertAdjacentHTML("beforeend", `<label title="how the image is cleaned — see the help button in the top bar for what each approach does">approach</label>
    <select onchange="applyPreset(this.value)">
      ${PRESETS.map(pr => `<option value="${pr.key}" ${state.preset === pr.key ? "selected" : ""}>${pr.label}</option>`).join("")}
      <option value="custom" ${state.preset === "custom" ? "selected" : ""}>Custom</option>
    </select>`);
  if (state.params.method === "nn") {
    const model = state.params.model || NN_MODELS[0] || "";
    f.insertAdjacentHTML("beforeend", `<label title="which trained network assigns the palette colors">model</label>
      <select onchange="setParam('model', this.value)">
        ${NN_MODELS.map(m => `<option value="${m}" ${m === model ? "selected" : ""}>${m}</option>`).join("")}
      </select>`);
    const off = state.params.leash === "" || state.params.leash == null;
    const lv = off ? 8 : state.params.leash;
    f.insertAdjacentHTML("beforeend", `<label title="(leash) the net may only pick palette colors within this color distance of what is actually in the image — lower is stricter, prevents creative recoloring; try 2–4 with dense fixed palettes, 8 otherwise"><input type="checkbox" ${off ? "" : "checked"}
        onchange="setLeash(this)"> limit recolor</label>
      <div class="pair">
        <input type="range" min="1" max="30" step="1" value="${lv}" ${off ? "disabled" : ""} oninput="fromRange('leash', this)">
        <input type="number" step="1" value="${lv}" ${off ? "disabled" : ""} oninput="fromNumber('leash', this)">
      </div>`);
  }
  const gi = granIndex(+state.params.granularity || 1);
  f.insertAdjacentHTML("beforeend", `<label title="(granularity) output resolution relative to the detected pixel grid — 2× keeps twice the detail per axis, ½× merges cells; for when the detected grid is coarser or finer than the art's real pixels">output detail</label>
    <div class="pair">
      <input type="range" min="0" max="${GRAN.length - 1}" step="1" value="${gi}" oninput="fromGran(this)">
      <span class="granv">${granLabel(GRAN[gi])}</span>
    </div>`);
  SLIDERS.forEach(([key, label, min, max, step, tip]) => {
    f.insertAdjacentHTML("beforeend", `<label title="${tip}">${label}</label>
      <div class="pair">
        <input type="range" min="${min}" max="${max}" step="${step}" value="${state.params[key]}" oninput="fromRange('${key}', this)">
        <input type="number" min="${min}" max="${max}" step="${step}" value="${state.params[key]}" oninput="fromNumber('${key}', this)">
      </div>`);
  });
  OPTIONAL.forEach(([key, label, min, max, step, dflt, tip]) => {
    const auto = state.params[key] === "" || state.params[key] == null;
    const v = auto ? dflt : state.params[key];
    f.insertAdjacentHTML("beforeend", `<label title="${tip}"><input type="checkbox" ${auto ? "checked" : ""}
        onchange="setAuto('${key}', this, ${dflt})"> ${label} auto</label>
      <div class="pair">
        <input type="range" min="${min}" max="${max}" step="${step}" value="${v}" ${auto ? "disabled" : ""} oninput="fromRange('${key}', this)">
        <input type="number" step="${step}" value="${v}" ${auto ? "disabled" : ""} oninput="fromNumber('${key}', this)">
      </div>`);
  });
  f.insertAdjacentHTML("beforeend", `<label title="(palette) force this exact output palette — every cell becomes one of these colors; near-duplicate entries are merged; overrides the colors control">fixed palette</label>
    <div class="pair">
      <input type="text" placeholder="auto — or #rrggbb,#rrggbb,…" value="${state.params.palette || ""}"
             style="font-size:11px" onchange="setParam('palette', this.value.trim())">
      <button title="import a palette file — .gpl, .pal, .ase, .txt, .hex, or any image (its distinct colors)"
              onclick="this.nextElementSibling.click()">⬆</button>
      <input type="file" hidden accept=".gpl,.pal,.ase,.txt,.hex,.png,.gif,.bmp,.webp,.jpg,.jpeg,image/*"
             onchange="importPaletteFile(this.files[0]); this.value='';">
    </div>`);
  f.insertAdjacentHTML("beforeend", `<label title="(denoise) median-filter each cell's pixels before reading its color — steadier flat areas on noisy input"><input type="checkbox" ${state.params.denoise ? "checked" : ""}
      onchange="setParam('denoise', this.checked)"> denoise</label>
    <label title="(smooth) removes single stray cells inside flat areas with a detail-guarded majority filter — isolated 1-px details survive"><input type="checkbox" ${state.params.smooth !== false ? "checked" : ""}
      onchange="setParam('smooth', this.checked)"> de-speckle</label>
    <label title="(consensus) areas with near-identical color get the same palette entry across the whole image — fixes far-apart backgrounds landing on different shades"><input type="checkbox" ${state.params.consensus ? "checked" : ""}
      onchange="setParam('consensus', this.checked)"> unify areas</label>`);
  box.appendChild(f);
}

function fromGran(el) {
  const g = GRAN[+el.value];
  el.parentNode.querySelector(".granv").textContent = granLabel(g);
  setParam("granularity", g);
}
function fromRange(key, el) { el.parentNode.querySelector("input[type=number]").value = el.value; setParam(key, el.value); }
function fromNumber(key, el) { el.parentNode.querySelector("input[type=range]").value = el.value; setParam(key, el.value); }
function setLeash(box) {
  const pair = box.parentNode.nextElementSibling;
  pair.querySelectorAll("input").forEach(i => i.disabled = !box.checked);
  setParam("leash", box.checked ? (+pair.querySelector("input[type=number]").value || 8) : "");
}

function setAuto(key, box, dflt) {
  const pair = box.parentNode.nextElementSibling;
  pair.querySelectorAll("input").forEach(i => i.disabled = box.checked);
  setParam(key, box.checked ? "" : (+pair.querySelector("input[type=number]").value || dflt));
}

function setParam(key, value) {
  state.params[key] = value;
  if (state.preset !== "custom" && key !== "model") {
    state.preset = "custom";
    const sel = document.querySelector("#paramsbox select");
    if (sel) sel.value = "custom";
  }
  saveState();
  clearTimeout(rt.timer);
  rt.timer = setTimeout(runClean, 300);
}

function applyPreset(key) {
  state.preset = key;
  if (key !== "custom") {
    const pr = PRESETS.find(x => x.key === key);
    state.params = { ...DEFAULTS, ...(pr ? pr.params : {}) };
  }
  saveState(); render();
}

function buildParams() {
  const nn = state.params.method === "nn";
  const out = nn ? { method: "nn" } : {};
  for (const [k, v] of Object.entries(state.params)) {
    if (k === "denoise" || k === "smooth" || k === "consensus") { out[k] = !!v; continue; }
    if (k === "method") continue;
    if (v === "" || v == null) continue;
    if (k === "palette" || k === "model") { out[k] = String(v); continue; }
    const n = +v;
    if (!Number.isFinite(n)) continue;
    if (k === "granularity" && n === 1) continue;
    out[k] = n;
  }
  if (nn && !out.model && NN_MODELS.length) out.model = NN_MODELS[0];
  return out;
}
function keyFor() { return state.image + "|" + JSON.stringify(buildParams()); }

// ---------- run ----------

async function runClean() {
  if (!state.image) { setStatus(); return; }
  const params = buildParams(), key = keyFor();
  if (result && result.key === key) {
    rt.pending = false; rt.error = null;   // the shown result IS current
    paintResult();
    return;
  }
  const token = ++rt.token;
  rt.pending = true; rt.error = null;
  paintResult();
  try {
    const resp = await fetch("/api/clean", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: state.image, params }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || resp.statusText);
    if (token !== rt.token) return;
    rt.pending = false;
    result = { image: data.image, info: data.info, key };
  } catch (e) {
    if (token !== rt.token) return;
    rt.pending = false; rt.error = e.message;
  }
  paintResult();
  renderStats();
}

function setStatus() {
  const el = document.getElementById("status");
  let txt = result ? infoLine(result.info) : "—";
  el.classList.toggle("err", !!rt.error);
  if (rt.error) txt = "error: " + rt.error;
  else if (rt.pending) txt = "running…" + (result ? " · showing last result" : "");
  el.textContent = txt;
}

function paintResult() {
  document.getElementById("center").classList.toggle("pending", !!rt.pending);
  setStatus();
  document.querySelector("#topbar .dl").disabled = !result;
  document.querySelector("#topbar .cc").disabled = !result;
  document.querySelectorAll("#center .imgwrap").forEach(wrap => {
    const out = wrap.querySelector("img.out");
    const isOrigPane = wrap.querySelector(".cap")?.textContent === "original";
    if (isOrigPane) return;
    if (result && out.dataset.key !== result.key) {
      out.src = result.image;
      out.dataset.key = result.key;
      wrap.classList.add("loaded");
      applyZoomAll();
    }
  });
}

function fmtGrid(g) { return g ? `${g.pitch_y.toFixed(2)}×${g.pitch_x.toFixed(2)}` : "—"; }
function infoLine(a) {
  const nn = a.method === "nn" ? `neural${a.model_step ? " @" + a.model_step + " steps" : ""} · ` : "";
  return `${nn}${a.out_w}×${a.out_h} · pitch ${fmtGrid(a.grid)} · ${a.palette_size} colors · residual ${a.residual_mean_de} ΔE (p95 ${a.residual_p95_de}) · fit ${a.cell_fit_mean} ΔE · ${a.seconds}s`;
}

// ---------- stats (right sidebar, bottom) ----------

function renderStats() {
  const box = document.getElementById("statsbox");
  const im = imgEntry();
  if (!im) { box.innerHTML = `<div class="note">no image</div>`; return; }
  const a = result && result.key === keyFor() ? result.info : null;
  const rows = [
    ["input", `${im.width}×${im.height}`],
    ["input colors", a ? a.input_colors.toLocaleString() : "—"],
    ["output", a ? `${a.out_w}×${a.out_h}` : "—"],
    ["pitch", a ? fmtGrid(a.grid) : "—"],
    ["detection z", a && a.grid && a.grid.z_y != null ? `${a.grid.z_y}/${a.grid.z_x}` : "—"],
    ["palette", a ? a.palette_size : "—"],
    ["residual ΔE", a ? `${a.residual_mean_de} (p95 ${a.residual_p95_de})` : "—"],
    ["fit ΔE", a ? a.cell_fit_mean : "—"],
    ["time", a ? a.seconds + "s" : "—"],
  ];
  box.innerHTML = `<table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>
    <div class="note" style="padding:8px 0 0; font-size:11px">residual = cleaned cells painted back vs input;<br>fit = sampled cell vs assigned palette entry (high on neural = the net recolors)</div>`;
}

// ---------- download + palette count ----------

function saveAs(href, filename, revoke) {
  const a = document.createElement("a");
  a.href = href;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  if (revoke) setTimeout(() => URL.revokeObjectURL(href), 2000);
}
function saveBlob(blob, filename) { saveAs(URL.createObjectURL(blob), filename, true); }

// "<source>.<preset>" — the shared stem of every file this view hands out
function outBaseName() {
  const src = ((result ? result.key.split("|")[0] : state.image) || "palette").replace(/\.[^.]+$/, "");
  return `${src}.${(state.preset || "custom").replace(/[^A-Za-z0-9._-]+/g, "-")}`;
}

function downloadResult() {
  if (!result) return;
  saveAs(result.image, `${outBaseName()}.${result.info.out_w}x${result.info.out_h}.png`);
}

// ---------- batch: clean every workspace image with the current params ----------

let batchResults = [], batchTag = "";

function toggleBatch() {
  const center = document.getElementById("center");
  const existing = center.querySelector(".batchpop");
  if (existing) { existing.remove(); return; }          // running loop stops via isConnected
  center.querySelectorAll(".colorpop:not(.batchpop)").forEach(e => e.remove());  // exclusive
  if (!IMAGES.length) return;
  const pop = document.createElement("div");
  pop.className = "colorpop batchpop";
  pop.innerHTML = `<div class="cphead"><b style="color:#d7dae0">Batch</b>
    <span style="color:#8a90a0">— ${state.preset} · ${IMAGES.length} images</span>
    <button class="x" title="close" onclick="this.closest('.batchpop').remove()">✕</button></div>
    <div class="bprog"><div class="bfill"></div></div>
    <div class="bstat">starting…</div>
    <div class="bgrid"></div>`;
  center.appendChild(pop);
  runBatch(pop);
}

async function runBatch(pop) {
  const params = buildParams();
  const fill = pop.querySelector(".bfill"), stat = pop.querySelector(".bstat"), grid = pop.querySelector(".bgrid");
  const results = [];
  const imgs = IMAGES.slice();
  for (let i = 0; i < imgs.length; i++) {
    if (!pop.isConnected) return;                        // closed → abort
    const im = imgs[i];
    stat.textContent = `processing ${i + 1}/${imgs.length}: ${im.name}`;
    fill.style.width = (100 * i / imgs.length) + "%";
    try {
      const resp = await fetch("/api/clean", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: im.name, params }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || resp.statusText);
      results.push({ name: im.name, image: data.image });
      grid.insertAdjacentHTML("beforeend",
        `<div class="bcell"><img src="${data.image}"><div class="bname">${im.name}</div></div>`);
    } catch (e) {
      results.push({ name: im.name, error: e.message });
      grid.insertAdjacentHTML("beforeend",
        `<div class="bcell err"><div class="bname">${im.name}<br><span style="color:#f77">${e.message}</span></div></div>`);
    }
  }
  if (!pop.isConnected) return;
  fill.style.width = "100%";
  batchResults = results.filter(r => !r.error);
  batchTag = (state.preset || "custom").replace(/[^A-Za-z0-9._-]+/g, "-");
  const errs = results.length - batchResults.length;
  stat.innerHTML = `done — ${batchResults.length}/${results.length} cleaned${errs ? ` (${errs} failed)` : ""}` +
    (batchResults.length ? ` <button onclick="downloadBatchZip()">⬇ download all (zip)</button>` : "");
}

function downloadBatchZip() {
  const files = batchResults.map(r => ({
    name: r.name.replace(/\.[^.]+$/, "") + "." + batchTag + ".png",
    bytes: b64ToBytes(r.image.split(",")[1]),
  }));
  saveBlob(buildZip(files), `ai2pixelart.${batchTag}.zip`);
}

function b64ToBytes(b64) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

const _crcTable = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = _crcTable[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function buildZip(files) {
  return new Blob([zipBytes(files)], { type: "application/zip" });
}

// minimal ZIP writer (stored / no compression — PNGs are already compressed)
function zipBytes(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.bytes), size = f.bytes.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, f.bytes);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, size, true); cd.setUint32(24, size, true);
    cd.setUint16(28, name.length, true); cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + size;
  }
  let centralSize = 0; for (const c of central) centralSize += c.length;
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, centralSize, true); eocd.setUint32(16, offset, true);
  let total = centralSize + 22; for (const p of parts) total += p.length;
  const out = new Uint8Array(total); let o = 0;
  for (const p of [...parts, ...central, new Uint8Array(eocd.buffer)]) { out.set(p, o); o += p.length; }
  return out;
}

function tallyColors(img) {
  return img.decode().then(() => {
    const w = img.naturalWidth, h = img.naturalHeight;
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const cx = cv.getContext("2d", { willReadFrequently: true });
    cx.drawImage(img, 0, 0);
    const d = cx.getImageData(0, 0, w, h).data;
    const counts = new Map();
    for (let i = 0; i < d.length; i += 4) {
      const k = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2];
      counts.set(k, (counts.get(k) || 0) + 1);
    }
    return { entries: [...counts.entries()].sort((a, b) => b[1] - a[1]), w, h };
  });
}

async function toggleColors() {
  const center = document.getElementById("center");
  const old = center.querySelector(".colorpop:not(.helppop):not(.batchpop)");
  center.querySelector(".helppop")?.remove();
  center.querySelector(".batchpop")?.remove();
  if (old) { old.remove(); return; }
  const img = center.querySelector("img.out[src^='data:'], img.out");
  if (!img || !img.src || !result) return;
  const pop = document.createElement("div");
  pop.className = "colorpop";
  const headHTML = (t, tools = "") => `<div class="cphead">${t}${tools}
    <button class="x" title="close" onclick="this.closest('.colorpop').remove()">✕</button></div>`;
  pop.innerHTML = headHTML("counting…");
  center.appendChild(pop);
  try {
    const { entries, w, h } = await tallyColors(img);
    const pixels = w * h, MAX = 256;
    pop.dataset.total = entries.length;
    // the output's palette, most-used first — what "export" writes out
    outPalette = entries.map(([c]) => [(c >> 16) & 255, (c >> 8) & 255, c & 255]);
    const pct = n => { const v = 100 * n / pixels; return v >= 1 ? v.toFixed(0) + "%" : v >= 0.01 ? v.toFixed(2) + "%" : "<0.01%"; };
    const cells = entries.slice(0, MAX).map(([c, n]) => {
      const hex = "#" + c.toString(16).padStart(6, "0");
      return `<div class="sw" title="${hex} · ${n.toLocaleString()} px · ${pct(n)} — click to copy"
        onclick="navigator.clipboard && navigator.clipboard.writeText('${hex}')">
        <div class="c" style="background:${hex}"></div><div class="t">${hex} · ${pct(n)}</div></div>`;
    }).join("");
    const tools = `<select title="palette export format" onchange="setPalFmt(this.value)">
        ${PAL_FORMATS.map(([k, label]) => `<option value="${k}" ${palFmt() === k ? "selected" : ""}>${label}</option>`).join("")}
      </select>
      <button title="download all ${entries.length.toLocaleString()} colors in the selected format"
              onclick="exportPalette()">⬇ export</button>`;
    pop.innerHTML =
      headHTML(`<b style="color:#d7dae0">${entries.length.toLocaleString()}</b>&nbsp;distinct colors · ${w}×${h} px`, tools) +
      `<div class="swatches">${cells}</div>` +
      (entries.length > MAX
        ? `<div class="note">showing the ${MAX} most frequent · ${(entries.length - MAX).toLocaleString()} more (export writes all)</div>` : "");
  } catch (e) {
    pop.innerHTML = headHTML("error: " + e.message);
  }
}

// ---------- palette import / export ----------
// Both directions are client-side. Import fills the fixed-palette field from
// any common palette file (or an image's distinct colors); export writes the
// output palette shown in the 🎨 popover back out in the formats the pixel
// art tools read. A palette is [[r,g,b], ...] in between.

const PAL_FORMATS = [
  ["png1", "PNG Image (1x)"],
  ["png8", "PNG Image (8x)"],
  ["png32", "PNG Image (32x)"],
  ["pal", "PAL File (JASC)"],
  ["ase", "Photoshop ASE"],
  ["txt", "Paint.net TXT"],
  ["gpl", "GIMP GPL"],
  ["hex", "HEX File"],
];
const PAL_MAX = 256;      // the server's cap on a forced palette
let outPalette = [];      // the 🎨 popover's tally, most-used color first

function hex6(c) { return "#" + c.map(v => v.toString(16).padStart(2, "0")).join(""); }
function u8(v) { return Math.max(0, Math.min(255, Math.round(v))); }
function palFmt() { return PAL_FORMATS.some(([k]) => k === state.palfmt) ? state.palfmt : PAL_FORMATS[0][0]; }
function setPalFmt(v) { state.palfmt = v; saveState(); }

// ----- writers -----

function palHEX(pal) { return pal.map(c => hex6(c).slice(1).toUpperCase()).join("\n") + "\n"; }

function palGPL(pal, name) {
  const rows = pal.map(c => c.map(v => String(v).padStart(3)).join(" ") + "\t" + hex6(c).slice(1).toUpperCase());
  return ["GIMP Palette", "Name: " + name, "Columns: 16", "#", ...rows].join("\n") + "\n";
}

function palPaintNet(pal, name) {
  const head = ["; paint.net palette — " + name, "; one AARRGGBB color per line"];
  return [...head, ...pal.map(c => "FF" + hex6(c).slice(1).toUpperCase())].join("\r\n") + "\r\n";
}

// JASC-PAL (Paint Shop Pro): magic, format version, count, then "r g b" lines
function palJASC(pal) {
  return ["JASC-PAL", "0100", String(pal.length), ...pal.map(c => c.join(" "))].join("\r\n") + "\r\n";
}

// Adobe Swatch Exchange: "ASEF", version, block count, then one big-endian
// color block per entry (DataView is big-endian by default, which is what
// ASE wants — unlike the little-endian ZIP writer above).
function palASE(pal) {
  const blocks = pal.map(c => aseBlock(hex6(c).slice(1).toUpperCase(), c));
  const head = new DataView(new ArrayBuffer(12));
  [..."ASEF"].forEach((ch, i) => head.setUint8(i, ch.charCodeAt(0)));
  head.setUint16(4, 1); head.setUint16(6, 0);        // version 1.0
  head.setUint32(8, blocks.length);
  return new Blob([head.buffer, ...blocks], { type: "application/octet-stream" });
}

function aseBlock(name, [r, g, b]) {
  const n = name.length + 1;                          // UTF-16 units incl. the NUL
  const len = 2 + 2 * n + 4 + 12 + 2;
  const v = new DataView(new ArrayBuffer(6 + len));
  v.setUint16(0, 0x0001);                             // block type: color entry
  v.setUint32(2, len);
  v.setUint16(6, n);
  let o = 8;
  for (const ch of name) { v.setUint16(o, ch.charCodeAt(0)); o += 2; }
  o += 2;                                             // name NUL terminator
  for (const ch of "RGB ") v.setUint8(o++, ch.charCodeAt(0));
  v.setFloat32(o, r / 255); v.setFloat32(o + 4, g / 255); v.setFloat32(o + 8, b / 255);
  v.setUint16(o + 12, 2);                             // color type: normal
  return new Uint8Array(v.buffer);
}

// one square swatch per color, `scale` px a side. Palettes wider than PAL_MAX
// wrap into rows so no canvas dimension explodes; an import reads any scale
// back in the same (row-major) order.
function palPNG(pal, scale) {
  const cols = Math.min(pal.length, PAL_MAX);
  const cv = document.createElement("canvas");
  cv.width = cols * scale;
  cv.height = Math.ceil(pal.length / cols) * scale;
  const cx = cv.getContext("2d");
  pal.forEach((c, i) => {
    cx.fillStyle = hex6(c);
    cx.fillRect((i % cols) * scale, Math.floor(i / cols) * scale, scale, scale);
  });
  return new Promise(ok => cv.toBlob(ok, "image/png"));
}

async function exportPalette() {
  if (!outPalette.length) return;
  const pal = outPalette, fmt = palFmt(), base = outBaseName() + ".palette";
  if (fmt.startsWith("png")) {
    const scale = +fmt.slice(3);
    saveBlob(await palPNG(pal, scale), `${base}.${scale}x.png`);
    return;
  }
  const [data, ext] = {
    pal: () => [palJASC(pal), "pal"],
    ase: () => [palASE(pal), "ase"],
    txt: () => [palPaintNet(pal, base), "txt"],
    gpl: () => [palGPL(pal, base), "gpl"],
    hex: () => [palHEX(pal), "hex"],
  }[fmt]();
  saveBlob(data instanceof Blob ? data : new Blob([data], { type: "text/plain" }), `${base}.${ext}`);
}

// ----- readers -----

async function importPaletteFile(file) {
  if (!file) return;
  try {
    let pal = await readPalette(file);
    const seen = new Set();
    pal = pal.filter(c => { const k = String(c); if (seen.has(k)) return false; seen.add(k); return true; });
    if (pal.length < 2) throw new Error(`${file.name} has ${pal.length} color(s) — a palette needs at least 2`);
    if (pal.length > PAL_MAX) {
      alert(`${file.name} has ${pal.length} colors — keeping the first ${PAL_MAX} (the palette limit).`);
      pal = pal.slice(0, PAL_MAX);
    }
    setParam("palette", pal.map(hex6).join(","));
    renderParams();
  } catch (e) {
    alert("palette import failed — " + e.message);
  }
}

async function readPalette(file) {
  if (/^image\//.test(file.type) || /\.(png|gif|bmp|webp|jpe?g)$/i.test(file.name)) return paletteFromImage(file);
  const buf = await file.arrayBuffer();
  const v = new DataView(buf);
  if (tag4(v, 0) === "ASEF") return parseASE(v);
  if (tag4(v, 0) === "RIFF") return parseRIFFPal(v);   // the other kind of .pal
  const pal = parsePaletteText(new TextDecoder().decode(buf));
  if (!pal.length) throw new Error(`no colors found in ${file.name}`);
  return pal;
}

function tag4(v, o) {
  if (o + 4 > v.byteLength) return "";
  return String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3));
}

// JASC .pal and GIMP .gpl list "r g b" per line; everything else (paint.net
// .txt with AARRGGBB, .hex, a pasted "#rrggbb,…") is scanned for hex tokens.
function parsePaletteText(text) {
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/);
  const head = (lines[0] || "").trim().toLowerCase();
  if (head.startsWith("jasc-pal") || head.startsWith("gimp palette")) return parseTripletLines(lines);
  const hexes = parseHexTokens(text);
  return hexes.length ? hexes : parseTripletLines(lines);
}

function parseTripletLines(lines) {
  const out = [];
  for (const line of lines) {
    const m = /^\s*(\d{1,3})[\s,]+(\d{1,3})[\s,]+(\d{1,3})/.exec(line);
    if (m) out.push([u8(+m[1]), u8(+m[2]), u8(+m[3])]);
  }
  return out;
}

function parseHexTokens(text) {
  const out = [];
  for (const tok of text.replace(/^[ \t]*;.*$/gm, "").split(/[^0-9a-fA-F]+/)) {
    const h = tok.length === 8 ? tok.slice(2) : tok.length === 6 ? tok : null;  // 8 = paint.net AARRGGBB
    if (h) out.push([0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)));
  }
  return out;
}

function parseASE(v) {
  const out = [];
  let o = 12;
  for (let i = 0, n = v.getUint32(8); i < n && o + 6 <= v.byteLength; i++) {
    const type = v.getUint16(o), len = v.getUint32(o + 2);
    if (o + 6 + len > v.byteLength) break;            // truncated file: keep what parsed
    if (type === 0x0001) {                            // color entry (groups are skipped)
      let p = o + 6;
      p += 2 + 2 * v.getUint16(p);                    // past the UTF-16 name
      const f = k => v.getFloat32(p + 4 + 4 * k);     // channels follow the 4-char model
      const model = tag4(v, p);
      if (model === "RGB ") out.push([0, 1, 2].map(k => u8(f(k) * 255)));
      else if (model === "CMYK") out.push([0, 1, 2].map(k => u8(255 * (1 - f(k)) * (1 - f(3)))));
      else if (model.toUpperCase() === "GRAY") out.push([0, 0, 0].map(() => u8(f(0) * 255)));
      else if (model === "LAB ") out.push(labToRGB(f(0) * 100, f(1), f(2)));
    }
    o += 6 + len;
  }
  return out;
}

// ASE stores Lab against D50, the way Photoshop writes it
function labToRGB(L, a, b) {
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
  const inv = t => (t ** 3 > 0.008856 ? t ** 3 : (116 * t - 16) / 903.3);
  const X = inv(fx) * 0.9642, Y = inv(fy), Z = inv(fz) * 0.8249;
  return [
    3.1338561 * X - 1.6168667 * Y - 0.4906146 * Z,
    -0.9787684 * X + 1.9161415 * Y + 0.0334540 * Z,
    0.0719453 * X - 0.2289914 * Y + 1.4052427 * Z,
  ].map(c => u8(255 * (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055)));
}

// Microsoft RIFF .pal: chunks, with the entries in "data" as r,g,b,flags
function parseRIFFPal(v) {
  let o = 12;
  while (o + 8 <= v.byteLength) {
    const id = tag4(v, o), size = v.getUint32(o + 4, true);
    if (id === "data") {
      if (o + 12 > v.byteLength) break;
      const n = v.getUint16(o + 10, true), out = [];
      for (let i = 0; i < n && o + 12 + 4 * i + 3 <= v.byteLength; i++) {
        const p = o + 12 + 4 * i;
        out.push([v.getUint8(p), v.getUint8(p + 1), v.getUint8(p + 2)]);
      }
      return out;
    }
    o += 8 + size + (size & 1);
  }
  return [];
}

// any image: its distinct colors in scan order — this is what reads an
// exported PNG strip back in, and pulls a palette off a reference image
async function paletteFromImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const cv = document.createElement("canvas");
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const cx = cv.getContext("2d", { willReadFrequently: true });
    cx.drawImage(img, 0, 0);
    const d = cx.getImageData(0, 0, cv.width, cv.height).data;
    const seen = new Set(), out = [];
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 8) continue;                     // transparent padding
      const k = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2];
      if (!seen.has(k)) { seen.add(k); out.push([d[i], d[i + 1], d[i + 2]]); }
    }
    return out;
  } finally {
    URL.revokeObjectURL(url);
  }
}

// ---------- help ----------

const HELP_HTML = `
<h3>Approaches</h3>
<p>An approach is a starting set of parameters plus the method that does the
coloring. Touching any parameter switches to <b>Custom</b>, keeping your
settings — the parameters below apply to every approach.</p>
<dl>
<dt>Simple</dt>
<dd>The classical algorithm, fully deterministic and CPU-only. It detects the
fake-pixel grid, reads each cell's color robustly, clusters those colors into
a palette, and snaps every cell to its nearest entry. All output colors are
taken from the image itself — dominant colors come out byte-exact. Its limit:
it cannot use context. A 1-pixel detail that arrived blurred keeps its blurred
mixture color, and heavy noise can split one flat area into several shades.</dd>
<dt>Neural Robust <span>— recommended</span></dt>
<dd>The same grid and palette proposal, but a trained network chooses each
cell's palette entry using shape and context. It learned to invert the way AI
image models render pixel art, so it can restore what the pixels alone no
longer contain: tiny details get their true color back (a white eye stays
pure white), noisy or vignetted backgrounds collapse into the one color a
pixel artist would have used, and it stays reliable with dense fixed palettes
and tile sheets. It can only ever output palette colors.</dd>
<dt>Neural Detail</dt>
<dd>An alternative network with the strongest retention of single-pixel
details on very fine grids (art pixels of 2–3 image pixels). Try it when
Robust simplifies fine art too aggressively.</dd>
</dl>
<p>When colors look wrong on a neural approach, compare the <b>fit ΔE</b>
stat against Simple's: if it is much higher, the network is repainting the
image and Simple is the safer choice for color fidelity.</p>

<h3>Parameters</h3>
<p>Controls marked <b>auto</b> let the server pick a measured default —
untick to override. ΔE is a perceptual color distance: 1 is barely visible,
5 is clearly distinct.</p>
<dl>
<dt>model</dt>
<dd>Which trained network assigns the colors (neural approaches only).</dd>
<dt>limit recolor <span>(leash)</span></dt>
<dd>Caps how far the network may deviate from what is actually in the image:
each cell may only take palette colors within this ΔE of the observed color.
Lower = stricter color fidelity, less creative correction. With dense fixed
palettes 2–4 works well; 8 is a good default otherwise. Off = unlimited.</dd>
<dt>output detail <span>(granularity)</span></dt>
<dd>Output resolution relative to the detected pixel grid. 2× keeps twice the
detail per axis (each detected cell splits in two), ½× merges cells. Use when
the detection locked onto a coarser or finer grid than the art's real pixels.</dd>
<dt>color merging <span>(merge ΔE)</span></dt>
<dd>How different two shades must be to remain separate palette colors.
Raising it merges near-duplicates into fewer, cleaner colors; lowering it
preserves subtle shading at the cost of a larger palette.</dd>
<dt>cell sampling <span>(cell window)</span></dt>
<dd>How much of each cell's interior is read to determine its color. Smaller
windows ignore color bleeding from neighboring cells (sharper on wobbly
grids); larger windows average more pixels (steadier on noise).</dd>
<dt>absorb amount <span>(absorb frac)</span> · absorb range <span>(absorb ΔE)</span></dt>
<dd>Cleanup of stray shades: a color covering less than the <i>amount</i>
share of the image can be swallowed by a stronger color within the
<i>range</i> ΔE. Raise to remove noise shades, lower to protect rare but
intentional colors. The auto range adapts to the detected pixel size.</dd>
<dt>pixel size <span>(pitch)</span></dt>
<dd>The size of one art pixel in image pixels. Auto-detected; set it manually
when detection fails — typically on very fine grids (under ~2 image pixels
per art pixel, which is undetectable in principle) or when decorative
patterns fool the detector.</dd>
<dt>colors <span>(max colors)</span></dt>
<dd>Target and cap for the palette size. Auto uses the image's natural
palette size. Asking for more splits similar shades back apart (exact count
whenever the image has that many distinguishable colors); asking for fewer
merges them.</dd>
<dt>fixed palette</dt>
<dd>Forces the exact output palette (hex colors, comma-separated, up to
256): every cell becomes one of these colors, with both approaches.
Near-duplicate entries are merged automatically. Note that colors genuinely
missing from the palette cannot be represented well by any method.
The <b>⬆</b> button next to the field imports a palette file —
<code>.gpl</code> (GIMP), <code>.pal</code> (JASC or RIFF),
<code>.ase</code> (Photoshop), <code>.txt</code> (paint.net),
<code>.hex</code>, or any image, whose distinct colors become the palette
(a palette strip exported below, or a reference picture). Everything past
the first 256 colors is dropped.</dd>
<dt>denoise</dt>
<dd>Median-filters each cell's pixels before reading its color — steadier
flat areas on noisy input, at a small cost in edge sharpness.</dd>
<dt>de-speckle <span>(smooth)</span></dt>
<dd>Removes single stray cells inside flat areas using a majority filter
with a detail guard: a cell only flips when its neighborhood strongly agrees
AND the new color also fits the underlying pixels — isolated 1-px details
survive.</dd>
<dt>unify areas <span>(consensus)</span></dt>
<dd>Forces areas with near-identical observed color to the same palette
entry across the whole image. Fixes far-apart flat regions (e.g. the
background of separate tiles) landing on different, randomly-decided
shades. Real color variation stays untouched.</dd>
</dl>

<h3>Palettes in and out</h3>
<p>The 🎨 popover lists the output's exact colors and exports them as a
<b>PNG</b> strip (one square swatch per color at 1×, 8× or 32×), a
<b>JASC .pal</b>, a <b>Photoshop .ase</b>, a <b>paint.net .txt</b>, a
<b>GIMP .gpl</b> or a plain <b>.hex</b> list. The fixed-palette field reads
all of those back in, so a palette can travel from one image to the next or
into another editor and back.</p>

<h3>Quality signals</h3>
<p><b>residual ΔE</b> — the cleaned cells painted back onto the input grid,
compared against the input. A fidelity signal that needs no ground truth;
note a neural approach that <i>corrects more</i> scores slightly worse here
by design. <b>fit ΔE</b> — how far the sampled cell colors sit from their
assigned palette entries; high values on a neural approach mean the network
is recoloring rather than snapping.</p>`;

function toggleHelp() {
  const center = document.getElementById("center");
  const old = center.querySelector(".helppop");
  center.querySelector(".colorpop:not(.helppop)")?.remove();
  if (old) { old.remove(); return; }
  const pop = document.createElement("div");
  pop.className = "colorpop helppop";
  pop.innerHTML = `<div class="cphead"><b style="color:#d7dae0">Approaches &amp; parameters</b>
    <button class="x" title="close" onclick="this.closest('.helppop').remove()">✕</button></div>
    <div class="helpbody">${HELP_HTML}</div>`;
  center.appendChild(pop);
}

// ---------- keyboard + focus policy ----------
// Space always drives the original/output toggle, except while editing text.
// Committing any control (Enter in a field, changing a select/checkbox,
// releasing a slider) blurs it, so Space immediately works again.

function editingText(t) {
  return t && t.tagName === "INPUT" && (t.type === "text" || t.type === "number");
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.tagName === "INPUT") { e.target.blur(); return; }
  if (e.code === "Space") {
    if (editingText(e.target)) return;
    e.preventDefault();
    if (!e.repeat) toggleSwap();
    return;
  }
  if (editingText(e.target) || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") stepImage(1);
  else if (e.key === "ArrowLeft") stepImage(-1);
  else if (e.key === "+" || e.key === "=") setZoomF((state.zoomF || 1) * 1.5);
  else if (e.key === "-") setZoomF((state.zoomF || 1) / 1.5);
  else if (e.key === "0") setFit();
});
document.addEventListener("change", e => {
  if (e.target.matches("select, input[type=checkbox], input[type=range], input[type=text]")) e.target.blur();
});
document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (el) el.blur();
});
</script>
